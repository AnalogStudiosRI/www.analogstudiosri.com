<html>
  <head>
    <title>Analog Studios RI - Contact</title>
    <meta property="og:title" content="Analog Studios RI - Contact" />
    <link rel="stylesheet" href="../styles/contact.css" />
    <script type="module" src="../scripts/contact.ts"></script>
  </head>
  <body>
    <div class="as-route-contact">
      <h2 class="header">Contact Us</h2>
      <p>
        Analog Studios is located in Newport RI and run by Owen Buckley and Dave Flamand. Please use
        the contact form below to send us a message!
      </p>

      <br />

      <p id="feedback"></p>

      <form name="contact" method="post">
        <label for="subject">Subject</label>
        <input name="subject" type="text" required />

        <label for="email">Email</label>
        <input name="email" type="email" required />

        <label for="message">Message:</label>
        <textarea name="message" required></textarea>

        <input type="hidden" name="info" />

        <button class="btn" type="submit">Send</button>
      </form>
    </div>
  </body>
</html>
